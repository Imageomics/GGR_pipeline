# pyproject.toml
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vare-id"
version = "0.1.0"
description = "This work presents a modular software pipeline and end-to-end workflow for video-based animal re-identification, which assigns consistent individual IDs by clustering multiview spatio-temporal tracks with minimal human intervention."
readme = "README.md"
requires-python = "==3.11"
dependencies = [
    # Beta Stability — active-review clustering algorithm.
    # Pinned to a specific commit for reproducibility; bump the SHA when the
    # algorithm is updated. Source: https://github.com/Imageomics/beta-stability
    # (d78f8aa: 865320e + stability.weak_positive_per_batch)
    "beta_stability @ git+https://github.com/Imageomics/beta-stability.git@d78f8aaea47f9cee8c1f84ab85f31dada5280bb1",
]

[tool.setuptools]
packages = { find = { include = ["VAREID"] } }