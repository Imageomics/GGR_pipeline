exp_name: lca_image
species: Grevys zebra
algorithm_type: stability
data:
  viewpoint_list:
  - left
  - right
  name_keys:
  - tracking_id
  # - individual_id
  id_key: "uuid"
  # Field written into each annotation; postprocessing reads LCA_clustering_id.
  output_key: LCA_clustering_id
  n_filter_min: 1
  n_filter_max: 100
  # annotation_file: ./zebra_annotations.json <-- provided by lca.py
  # embedding_file: ./zebra_embeddings.pickle <-- provided by lca.py
  # output_path: ./output <-- provided by lca.py
  # separate_viewpoints: true <-- provided by lca.py
algorithm:
  target_edges: 0
  initial_topk: 10
edge_weights:
  prob_human_correct: 1.0
  classifier_thresholds:
    miewid: 0.8
    tracking(miewid): miewid
  verifier_names:  tracking(miewid) no_human
logging:
  log_level: INFO
  # log_file: tmp/logs/whaleshark_kde.log <-- provided by lca.py
  auto_threshold_plot_path: ""
  update_log_file: false
  file_mode: w # or a for append
gc:
  verifier_name:  tracking(miewid)
  theta: 0.1
  validation_step: 20
  max_densify_edges: 200

# Stability algorithm specific configuration
stability:
  # GC-like threshold for Phase 0 (reaching 0-stability)
  theta: 0.1

  # Target stability level (in [0, 1] scale)
  # Higher values require more human reviews but produce more reliable clusters
  target_alpha: 0.5

  # Maximum number of human reviews before stopping
  max_human_reviews: 500

  # Confidence added/subtracted per human review (in [0, 1] scale)
  review_confidence: 0.97

  # Phase 0 iterations per step
  warmup_iterations: 10

  # Number of edges to send for human review per batch between PCCs
  edges_per_review_batch: 50

  # Validation against ground truth every N human reviews
  validation_step: 100

  # Maximum edges to add when densifying a component
  max_densify_edges: 0

  # Phase 0 stability threshold (slightly negative = less aggressive fragmentation)
  phase0_alpha: 0.0

  # Maximum cross-PCC edges to discover per iteration
  cross_pcc_max_edges: 1000000

  # Verifier for edge classification
  verifier_name: miewid

  densify_prioritize_negatives: true

  # Maximum human review attempts per edge
  tries_before_edge_done: 4

  # Merge priority: fraction of review batch dedicated to merge candidates (0.0-1.0)
  merge_priority: 0.7